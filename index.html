<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Multi-Stworki MP4 - Barcode AR</title>
    
    <!-- Sprawdzone biblioteki AR.js + A-Frame -->
     <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
          #video-0, #video-3, #video-5 { display: none; }
    </style>

</head>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
        
        <a-assets>
            <!-- Tutaj definiujemy 3 różne pliki wideo dla każdego stworka -->
            <video id="video-0" src="stworek0.mp4" preload="auto" loop="true" crossorigin="anonymous" playsinline webkit-playsinline></video>
            <video id="video-3" src="stworek3.mp4" preload="auto" loop="true" crossorigin="anonymous" playsinline webkit-playsinline></video>
            <video id="video-5" src="stworek5.mp4" preload="auto" loop="true" crossorigin="anonymous" playsinline webkit-playsinline></video>
        </a-assets>

        <!-- MARKER 0 -->
        <a-marker type="barcode" value="0" id="marker-0">
            <a-video src="#video-0" width="2" height="1.5" rotation="-90 0 0" position="0 0 0"></a-video>
        </a-marker>

        <!-- MARKER 3 -->
        <a-marker type="barcode" value="3" id="marker-3">
            <a-video src="#video-3" width="2" height="1.5" rotation="-90 0 0" position="0 0 0"></a-video>
        </a-marker>

        <!-- MARKER 5 -->
        <a-marker type="barcode" value="5" id="marker-5">
            <a-video src="#video-5" width="2" height="1.5" rotation="-90 0 0" position="0 0 0"></a-video>
        </a-marker>

        

    </a-scene>

    <script>
        // Automatyczna obsługa włączania i wyłączania filmów dla wielu markerów
        const setupMarkerVideo = (markerId, videoId) => {
            const marker = document.querySelector(markerId);
            const video = document.querySelector(videoId);

            marker.addEventListener('markerFound', () => {
                video.play().catch(err => console.log("Czekam na kliknięcie ekranu...", err));
            });

            marker.addEventListener('markerLost', () => {
                video.pause();
            });
        };

        // Podpinamy logikę pod wszystkie 3 stworki
        setupMarkerVideo('#marker-0', '#video-0');
        setupMarkerVideo('#marker-3', '#video-3');
        setupMarkerVideo('#marker-5', '#video-5');
    </script>

</body>
</html>
